<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        .font-display { font-family: 'DM Serif Display', serif; }
        .grid-albums {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .album-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .album-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }
        .album-img {
            aspect-ratio: 1/1;
            object-fit: cover;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .album-img.loaded { opacity: 1; }
        .img-placeholder {
            aspect-ratio: 1/1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, oklch(0.25 0.02 260), oklch(0.2 0.02 300));
        }
        .multi-select-dropdown { position: relative; }
        .multi-select-menu {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 50;
            max-height: 280px;
            overflow-y: auto;
            min-width: 200px;
            display: none;
        }
        .multi-select-menu.open { display: block; }
        .filter-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        @media (max-width: 768px) {
            .filter-section { display: none; }
            .filter-section.open { display: flex; }
        }
    </style>
</head>
<body class="min-h-screen bg-base-200">
    <div id="unlock" class="hero min-h-screen">
        <div class="hero-content">
            <div class="card w-96 bg-base-100 shadow-2xl">
                <div class="card-body items-center text-center">
                    <h2 class="font-display text-3xl">Music Library</h2>
                    <p class="text-base-content/50 text-sm mt-1">Enter passphrase to browse your collection</p>
                    <div class="form-control mt-6 w-full">
                        <input type="password" id="passphrase" placeholder="Passphrase" class="input input-bordered w-full" autofocus>
                    </div>
                    <div class="card-actions mt-4">
                        <button class="btn btn-primary btn-wide" onclick="unlock()">Unlock</button>
                    </div>
                    <p class="text-error text-center text-sm mt-2" id="error"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="hidden p-4 lg:p-8 max-w-[1300px] mx-auto">
        <div class="sticky top-0 bg-base-200/80 backdrop-blur-md z-10 pb-3 pt-3 -mx-4 px-4 lg:-mx-8 lg:px-8">
            <div class="flex items-center justify-between mb-3">
                <h1 class="font-display text-4xl">Music Library</h1>
                <div class="flex items-center gap-2">
                    <button class="btn btn-primary btn-sm gap-1" onclick="document.getElementById('addModal').showModal()">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span class="hidden sm:inline">Add</span>
                    </button>
                    <button class="btn btn-ghost btn-sm md:hidden" onclick="toggleFilterPanel()" id="filterToggleBtn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                        <span class="text-xs" id="filterBadge"></span>
                    </button>
                    <p class="text-sm text-base-content/50" id="count"></p>
                </div>
            </div>
            <div class="filter-section flex flex-wrap gap-2 items-center" id="filterSection">
                <div class="multi-select-dropdown" id="feelingDropdown">
                    <button class="btn btn-outline btn-sm gap-2" onclick="toggleMenu('feeling')">
                        <span id="feelingLabel">All feelings</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div class="multi-select-menu bg-base-100 rounded-box shadow-xl p-2 mt-1" id="feelingMenu"></div>
                </div>
                <div class="multi-select-dropdown" id="genreDropdown">
                    <button class="btn btn-outline btn-sm gap-2" onclick="toggleMenu('genre')">
                        <span id="genreLabel">All genres</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div class="multi-select-menu bg-base-100 rounded-box shadow-xl p-2 mt-1" id="genreMenu"></div>
                </div>
                <div class="multi-select-dropdown" id="ratingDropdown">
                    <button class="btn btn-outline btn-sm gap-2" onclick="toggleMenu('rating')">
                        <span id="ratingLabel">All ratings</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div class="multi-select-menu bg-base-100 rounded-box shadow-xl p-2 mt-1" id="ratingMenu"></div>
                </div>
                <div class="multi-select-dropdown" id="sortDropdown">
                    <button class="btn btn-outline btn-sm gap-2" onclick="toggleMenu('sort')">
                        <span id="sortLabel">Sort: date added</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <div class="multi-select-menu bg-base-100 rounded-box shadow-xl p-2 mt-1" id="sortMenu"></div>
                </div>
                <input type="text" id="search" placeholder="Search..." class="input input-bordered input-sm w-40">
                <button class="btn btn-ghost btn-sm text-error hidden" id="resetBtn" onclick="resetAll()">Reset</button>
            </div>
            <div class="filter-pills mt-2" id="activePills"></div>
        </div>
        <div class="grid-albums mt-4" id="grid"></div>
    </div>

    <dialog id="addModal" class="modal">
        <div class="modal-box max-w-lg">
            <h3 class="font-display text-xl mb-2">Add album to library</h3>
            <p class="text-sm text-base-content/60 mb-4">It will be searched on Discogs and added to your collection within a day.</p>
            <div class="flex flex-col gap-3">
                <input type="text" id="addQuery" placeholder="Artist - Title or Spotify link" class="input input-bordered w-full">
                <div class="grid grid-cols-2 gap-3">
                    <select id="addFeeling" class="select select-bordered select-sm w-full"><option value="">Feeling</option></select>
                    <select id="addGenre" class="select select-bordered select-sm w-full"><option value="">Genre</option></select>
                    <select id="addInstruments" class="select select-bordered select-sm w-full"><option value="">Instruments</option></select>
                    <select id="addRating" class="select select-bordered select-sm w-full">
                        <option value="">Rating</option>
                        <option value="1">★</option>
                        <option value="2">★★</option>
                        <option value="3">★★★</option>
                        <option value="4">★★★★</option>
                        <option value="5">★★★★★</option>
                    </select>
                </div>
            </div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">Cancel</button>
                </form>
                <button class="btn btn-primary" id="addSubmitBtn" onclick="submitAddRequest()">Submit</button>
            </div>
            <p class="text-sm mt-2" id="addStatus"></p>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script>
        let collection = [];
        const selected = { feeling: new Set(), genre: new Set() };
        document.getElementById("passphrase").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

        async function decrypt(encrypted, passphrase) {
            const salt = Uint8Array.from(atob(encrypted.salt), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(encrypted.iv), c => c.charCodeAt(0));
            const data = Uint8Array.from(atob(encrypted.data), c => c.charCodeAt(0));
            const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
            return new TextDecoder().decode(decrypted);
        }

        async function unlock() {
            const passphrase = document.getElementById("passphrase").value;
            document.getElementById("error").textContent = "";
            try {
                const resp = await fetch("collection.enc.json");
                const encrypted = await resp.json();
                const payload = JSON.parse(await decrypt(encrypted, passphrase));
                if (Array.isArray(payload)) {
                    collection = payload;
                } else {
                    collection = payload.collection;
                    if (payload.gh_issues_token) ghIssueToken = payload.gh_issues_token;
                    if (payload.config) fieldConfig = payload.config.fields;
                }
                showApp();
            } catch (e) { document.getElementById("error").textContent = "Wrong passphrase"; }
        }

        let currentRating = 0;
        let currentSort = "added";

        function showApp() {
            document.getElementById("unlock").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            populateFilters(); populateAddForm(); render();
            document.getElementById("search").addEventListener("input", render);
            document.addEventListener("click", e => {
                if (!e.target.closest(".multi-select-dropdown")) closeAllMenus();
            });
        }

        function populateAddForm() {
            if (!fieldConfig) return;
            const populate = (id, values) => {
                const el = document.getElementById(id);
                values.forEach(v => el.add(new Option(v, v)));
            };
            if (fieldConfig.Feeling) populate("addFeeling", fieldConfig.Feeling);
            if (fieldConfig.MyGeneres) populate("addGenre", fieldConfig.MyGeneres);
            if (fieldConfig.Instruments) populate("addInstruments", fieldConfig.Instruments);
        }

        function populateFilters() {
            const feelings = new Set(), genres = new Set();
            collection.forEach(r => {
                const f = r.custom_fields["Feeling"]; if (f) f.split(",").forEach(v => feelings.add(v.trim()));
                const g = r.custom_fields["MyGeneres"]; if (g) g.split(",").forEach(v => genres.add(v.trim()));
            });
            buildCheckboxMenu("feeling", [...feelings].sort());
            buildCheckboxMenu("genre", [...genres].sort());
            buildRadioMenu("rating", [
                {value: "0", label: "All ratings"},
                {value: "1", label: "1+ stars"},
                {value: "2", label: "2+ stars"},
                {value: "3", label: "3+ stars"},
                {value: "4", label: "4+ stars"},
                {value: "5", label: "5 stars"},
            ]);
            buildRadioMenu("sort", [
                {value: "added", label: "Date added"},
                {value: "rating", label: "Rating"},
                {value: "artist", label: "Artist"},
                {value: "year", label: "Year"},
            ]);
        }

        function buildCheckboxMenu(type, items) {
            const menu = document.getElementById(type + "Menu");
            menu.innerHTML = items.map(item => `
                <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer hover:bg-base-200">
                    <input type="checkbox" class="checkbox checkbox-sm" value="${esc(item)}" onchange="toggleFilter('${type}', this.value, this.checked)">
                    <span class="text-sm">${esc(item)}</span>
                </label>
            `).join("");
        }

        function buildRadioMenu(type, options) {
            const menu = document.getElementById(type + "Menu");
            menu.innerHTML = options.map(opt => `
                <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer hover:bg-base-200">
                    <input type="radio" name="${type}" class="radio radio-sm" value="${opt.value}" ${opt.value === (type === "rating" ? "0" : "added") ? "checked" : ""} onchange="selectRadio('${type}', this.value, '${esc(opt.label)}')">
                    <span class="text-sm">${esc(opt.label)}</span>
                </label>
            `).join("");
        }

        function selectRadio(type, value, label) {
            if (type === "rating") {
                currentRating = parseInt(value);
                document.getElementById("ratingLabel").textContent = currentRating === 0 ? "All ratings" : `${value}+ stars`;
            } else {
                currentSort = value;
                document.getElementById("sortLabel").textContent = "Sort: " + label;
            }
            closeAllMenus();
            updateResetBtn();
            render();
        }

        function toggleMenu(type) {
            const menu = document.getElementById(type + "Menu");
            const wasOpen = menu.classList.contains("open");
            closeAllMenus();
            if (!wasOpen) menu.classList.add("open");
        }

        function closeAllMenus() {
            document.querySelectorAll(".multi-select-menu").forEach(m => m.classList.remove("open"));
        }

        function toggleFilter(type, value, checked) {
            if (checked) selected[type].add(value);
            else selected[type].delete(value);
            updateLabel(type);
            updatePills();
            updateResetBtn();
            render();
        }

        function updateLabel(type) {
            const label = document.getElementById(type + "Label");
            const count = selected[type].size;
            const name = type === "feeling" ? "feelings" : "genres";
            label.textContent = count === 0 ? `All ${name}` : `${count} ${name}`;
        }

        function updatePills() {
            const container = document.getElementById("activePills");
            let html = "";
            selected.feeling.forEach(v => { html += pill(v, "feeling", "badge-secondary"); });
            selected.genre.forEach(v => { html += pill(v, "genre", "badge-accent"); });
            container.innerHTML = html;
        }

        function pill(value, type, cls) {
            return `<span class="badge ${cls} gap-1 cursor-pointer" onclick="removePill('${type}','${esc(value)}')">${esc(value)} ✕</span>`;
        }

        function removePill(type, value) {
            selected[type].delete(value);
            const menu = document.getElementById(type + "Menu");
            const cb = menu.querySelector(`input[value="${value}"]`);
            if (cb) cb.checked = false;
            updateLabel(type);
            updatePills();
            updateResetBtn();
            render();
        }

        function hasActiveFilters() {
            return selected.feeling.size > 0 || selected.genre.size > 0 || currentRating > 0 || document.getElementById("search").value !== "";
        }

        function updateResetBtn() {
            const btn = document.getElementById("resetBtn");
            if (hasActiveFilters()) btn.classList.remove("hidden");
            else btn.classList.add("hidden");
            const badge = document.getElementById("filterBadge");
            const count = selected.feeling.size + selected.genre.size + (currentRating > 0 ? 1 : 0);
            badge.textContent = count > 0 ? count : "";
        }

        function resetAll() {
            selected.feeling.clear();
            selected.genre.clear();
            currentRating = 0;
            document.getElementById("search").value = "";
            document.querySelectorAll(".multi-select-menu input[type=checkbox]").forEach(cb => cb.checked = false);
            document.querySelector('input[name="rating"][value="0"]').checked = true;
            document.getElementById("ratingLabel").textContent = "All ratings";
            updateLabel("feeling");
            updateLabel("genre");
            updatePills();
            updateResetBtn();
            render();
        }

        function toggleFilterPanel() {
            document.getElementById("filterSection").classList.toggle("open");
        }

        function render() {
            const query = document.getElementById("search").value.toLowerCase();
            const minRating = currentRating;
            const sortBy = currentSort;
            let filtered = collection.filter(r => {
                if (query && !`${r.artists.join(" ")} ${r.title}`.toLowerCase().includes(query)) return false;
                if (selected.feeling.size) {
                    const vals = (r.custom_fields["Feeling"] || "").split(",").map(s => s.trim());
                    if (!vals.some(v => selected.feeling.has(v))) return false;
                }
                if (selected.genre.size) {
                    const vals = (r.custom_fields["MyGeneres"] || "").split(",").map(s => s.trim());
                    if (!vals.some(v => selected.genre.has(v))) return false;
                }
                if (minRating && (r.rating || 0) < minRating) return false;
                return true;
            });
            if (sortBy === "rating") filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            else if (sortBy === "artist") filtered.sort((a, b) => a.artists[0].localeCompare(b.artists[0]));
            else if (sortBy === "year") filtered.sort((a, b) => (b.year || 0) - (a.year || 0));
            document.getElementById("count").textContent = `${filtered.length} / ${collection.length} releases`;
            document.getElementById("grid").innerHTML = filtered.map(r => cardHtml(r)).join("");
        }

        function cardHtml(r) {
            const img = r.cover_image || r.thumb;
            const imgBlock = img
                ? `<img src="${esc(img)}" alt="" class="album-img" loading="lazy" onload="this.classList.add('loaded')">`
                : `<div class="img-placeholder"><svg class="w-16 h-16 opacity-20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg></div>`;
            return `<div class="card bg-base-100 shadow-md album-card overflow-hidden">
                <figure class="bg-base-300">${imgBlock}</figure>
                <div class="p-4">
                    <div class="flex items-start justify-between">
                        <h3 class="font-display text-lg leading-tight">${esc(r.artists.join(", "))}</h3>
                        <span class="text-xs text-base-content/40 shrink-0 ml-2 mt-1">${r.year || ""}</span>
                    </div>
                    <p class="text-sm text-base-content/60 mt-1">${esc(r.title)}</p>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-sm tracking-wider text-warning">${stars(r.rating || 0)}</span>
                        ${r.spotify_url ? `<a href="${esc(r.spotify_url)}" target="_blank" rel="noopener" class="opacity-40 hover:opacity-100 transition-opacity" title="Open in Spotify"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg></a>` : ""}
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        ${tagHtml(r.custom_fields["Feeling"], "badge-secondary")}
                        ${tagHtml(r.custom_fields["MyGeneres"], "badge-accent")}
                    </div>
                </div>
            </div>`;
        }

        function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
        function tagHtml(v, cls) { return v ? v.split(",").map(s => `<span class="badge ${cls} badge-sm">${esc(s.trim())}</span>`).join("") : ""; }
        function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

        let ghIssueToken = null;
        let fieldConfig = null;

        async function submitAddRequest() {
            const query = document.getElementById("addQuery").value.trim();
            const feeling = document.getElementById("addFeeling").value;
            const genre = document.getElementById("addGenre").value;
            const instruments = document.getElementById("addInstruments").value;
            const rating = document.getElementById("addRating").value;
            const status = document.getElementById("addStatus");
            const btn = document.getElementById("addSubmitBtn");

            if (!query) { status.textContent = "Please enter an album to add."; status.className = "text-sm mt-2 text-warning"; return; }

            if (!ghIssueToken) {
                status.textContent = "No GitHub token configured. Set GH_ISSUES_TOKEN secret.";
                status.className = "text-sm mt-2 text-error";
                return;
            }

            btn.classList.add("loading");
            status.textContent = "";

            const spotifyMatch = query.match(/https:\/\/open\.spotify\.com\/album\/([a-zA-Z0-9]+)/);

            const fields = [];
            if (feeling) fields.push(`- **Feeling:** ${feeling}`);
            if (genre) fields.push(`- **MyGeneres:** ${genre}`);
            if (instruments) fields.push(`- **Instruments:** ${instruments}`);
            if (rating) fields.push(`- **Rating:** ${rating}`);
            if (spotifyMatch) fields.push(`- **SpotifyURL:** ${spotifyMatch[0]}`);
            const body = fields.length ? `### Custom fields\n\n${fields.join("\n")}` : "";

            try {
                const resp = await fetch("https://api.github.com/repos/LorenzoCavatorta/music-library-manager/issues", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${ghIssueToken}`,
                        "Accept": "application/vnd.github+json",
                    },
                    body: JSON.stringify({
                        title: `Add: ${query}`,
                        labels: ["library-addition-request"],
                        body: body,
                    }),
                });

                if (resp.ok) {
                    status.textContent = "Submitted! It will appear in your library within a day.";
                    status.className = "text-sm mt-2 text-success";
                    document.getElementById("addQuery").value = "";
                    document.getElementById("addFeeling").value = "";
                    document.getElementById("addGenre").value = "";
                    document.getElementById("addInstruments").value = "";
                    document.getElementById("addRating").value = "";
                } else {
                    const err = await resp.json();
                    status.textContent = `Error: ${err.message || resp.status}`;
                    status.className = "text-sm mt-2 text-error";
                }
            } catch (e) {
                status.textContent = "Network error. Please try again.";
                status.className = "text-sm mt-2 text-error";
            }
            btn.classList.remove("loading");
        }

        document.getElementById("addQuery").addEventListener("keydown", e => {
            if (e.key === "Enter") submitAddRequest();
        });
    </script>
</body>
</html>
