name: Process add-requests

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Process add-request issues
        id: process
        continue-on-error: true
        run: uv run python process_requests.py
        env:
          GH_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

      - name: Export Discogs collection
        run: uv run python export_collection.py
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

      - name: Encrypt collection
        run: uv run python encrypt_collection.py
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Fail if any requests could not be processed
        if: steps.process.outcome == 'failure'
        run: |
          echo "::error::Some add-requests failed to process. Check open issues with the 'needs-attention' label."
          exit 1
