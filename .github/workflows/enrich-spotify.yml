name: Enrich Spotify links

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enrich-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Enrich with Spotify links
        id: enrich
        continue-on-error: true
        run: uv run python enrich_spotify.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit collection updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collection.json
          git diff --cached --quiet || git commit -m "Enrich Spotify links" && git push

      - name: Encrypt collection
        run: uv run python encrypt_collection.py
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Warn if enrichment was incomplete
        if: steps.enrich.outcome == 'failure'
        run: |
          echo "::warning::Spotify enrichment was incomplete (likely rate-limited). Re-run later to finish."
